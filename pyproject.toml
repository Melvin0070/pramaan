[project]
name = "pramaan"
version = "0.1.0"
description = "Evidence-gated vulnerability triage-and-remediation harness on the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.151",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
pramaan = "pramaan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pramaan"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
